## Query to run 'ansible-inventory -i frontend.aws_ec2.yaml --list'
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
hostnames:
  # This option allows displaying the private ip addresses.
  - private-ip-address
filters:
  # This option allows filtering the instances based on running and tags (Name=frontend-dev)
  instance-state-name: running
  #tag:Component: frontend
  tag:Name: frontend-dev
keyed_groups:
  # This creates host groups based on key.
  - separator: ''
    key: tags.Component
